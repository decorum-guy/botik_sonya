name: Apply change payload

on:
  pull_request:
    paths:
      - 'change_payload.part*'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply prepared files
        run: |
          cat change_payload.part* > /tmp/change_payload.b64
          base64 -d /tmp/change_payload.b64 > /tmp/change_payload.tar.gz
          tar -xzf /tmp/change_payload.tar.gz
          rm -f change_payload.part*
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add memory variables and password admin onboarding"
          git push origin HEAD:${{ github.head_ref }}
