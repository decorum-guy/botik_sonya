name: Bootstrap project

on:
  push:
    paths:
      - 'bootstrap_payload.part*'
  pull_request:
    paths:
      - 'bootstrap_payload.part*'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Unpack project payload
        run: |
          cat bootstrap_payload.part* > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz
          touch .bootstrap_done
      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build initial bot and roadmap studio" || exit 0
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
