name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tools tests
      - run: python -m tools.validate_roadmap roadmap/quest.json
      - run: pytest -q
      - name: Check builder JavaScript syntax
        run: node --check builder/app.js
